<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ANTHEA anthemion app icon</title>
  <desc id="desc">A geometric five-leaf anthemion rising from an architectural capital.</desc>
  <rect x="32" y="32" width="960" height="960" rx="208" fill="#0B2A4A"/>

  <!-- Outer leaves: broad structural arches. -->
  <path fill="#F3F5F1" d="M456 704C302 678 190 529 184 366c142 43 244 159 272 338Z"/>
  <path fill="#F3F5F1" d="M568 704c154-26 266-175 272-338-142 43-244 159-272 338Z"/>

  <!-- Inner leaves: the ordered fan of the classical anthemion. -->
  <path fill="#F3F5F1" d="M486 704C364 594 326 370 370 222c84 116 125 292 116 482Z"/>
  <path fill="#F3F5F1" d="M538 704c122-110 160-334 116-482-84 116-125 292-116 482Z"/>

  <!-- Central golden growth axis. -->
  <path fill="#C99532" d="M512 704c-62-152-42-395 0-548 42 153 62 396 0 548Z"/>

  <!-- Architectural capital / structural beam and node. -->
  <rect x="210" y="730" width="604" height="64" rx="32" fill="#C99532"/>
  <circle cx="512" cy="730" r="54" fill="#C99532" stroke="#0B2A4A" stroke-width="18"/>
  <rect x="284" y="806" width="456" height="54" rx="27" fill="#F3F5F1"/>
</svg>
